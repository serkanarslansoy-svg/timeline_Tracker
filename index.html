<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf8ff">
  <title>Martur Italy — Zaman Çizelgesi</title>
  <link rel="icon" href="logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --surface: #faf8ff;
      --lowest: #ffffff;
      --low: #f2f3ff;
      --container: #eaedff;
      --high: #e2e7ff;
      --ink: #131b2e;
      --muted: #434655;
      --outline: #c3c6d7;
      --primary: #004ac6;
      --primary-c: #2563eb;
      --on-primary: #ffffff;
      --primary-fixed: #dbe1ff;
      --secondary: #006a61;
      --secondary-c: #86f2e4;
      --error: #ba1a1a;
      --shadow: 0 1px 8px rgba(19, 27, 46, 0.06);
      --sans: "Inter", "Segoe UI", sans-serif;
      --display: "Plus Jakarta Sans", "Inter", sans-serif;
      --col: 36px;
      --tree: 400px;
      --row: 52px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      color: var(--ink);
      background: var(--surface);
      min-height: 100vh;
    }
    button, input, select { font-family: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    :focus-visible { outline: 2px solid var(--primary-c); outline-offset: 2px; }
    svg.i { width: 16px; height: 16px; display: block; flex: none; }

    .top {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(250, 248, 255, 0.92);
      backdrop-filter: blur(16px);
      box-shadow: 0 1px 8px rgba(0, 0, 0, 0.04);
    }
    .top-inner {
      max-width: 1680px;
      margin: 0 auto;
      min-height: 72px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand-row, .tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
    .lockup {
      background: #000;
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      line-height: 0;
    }
    .lockup img { height: 28px; width: auto; display: block; }
    .rule { width: 1px; height: 22px; background: var(--outline); }
    .project-select, .search, .field input, .field select {
      background: var(--low);
      border: 0;
      color: var(--ink);
      border-radius: 999px;
    }
    .project-select {
      height: 38px;
      padding: 0 14px;
      font-weight: 600;
      font-size: 13px;
      max-width: 280px;
    }
    .tabs {
      display: flex;
      gap: 2px;
      background: var(--lowest);
      padding: 4px;
      border-radius: 999px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }
    .tabs button, .zoom button, .seg button {
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      height: 32px;
      padding: 0 12px;
    }
    .tabs button.on, .zoom button.on, .seg button.on {
      background: var(--primary-c);
      color: white;
    }
    .search {
      height: 38px;
      padding: 0 14px;
      width: min(240px, 100%);
      font-size: 13px;
    }
    .btn {
      height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      border: 0;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--lowest);
      color: var(--ink);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }
    .btn:hover { background: var(--low); }
    .btn-primary { background: var(--primary-c); color: white; box-shadow: none; }
    .btn-primary:hover { background: var(--primary); }
    .btn-quiet { background: transparent; box-shadow: none; color: var(--muted); }
    .btn-quiet:hover { background: var(--container); color: var(--ink); }
    .btn-danger { background: transparent; box-shadow: none; color: var(--error); }

    .wrap { max-width: 1680px; margin: 0 auto; padding: 20px 20px 48px; display: flex; flex-direction: column; gap: 16px; }
    .card {
      background: var(--lowest);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }
    .context {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .mark {
      width: 42px; height: 42px; border-radius: 12px;
      background: rgba(37, 99, 235, 0.1);
      color: var(--primary);
      display: grid; place-items: center;
      flex: none;
    }
    .mark svg { width: 22px; height: 22px; }
    .title-row { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
    h1 {
      margin: 0;
      font-family: var(--display);
      font-size: 24px;
      line-height: 1.25;
      letter-spacing: -0.01em;
      font-weight: 600;
    }
    .meta { margin: 4px 0 0; color: var(--muted); font-size: 12px; font-weight: 600; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--outline); display: inline-block; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      height: 28px; padding: 0 10px; border-radius: 999px;
      font-size: 12px; font-weight: 700;
      background: rgba(134, 242, 228, 0.45);
      color: #005049;
    }
    .badge.idle { background: var(--container); color: var(--muted); }
    .badge.done { background: rgba(134, 242, 228, 0.7); color: #005049; }
    .badge i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .progress-line { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
    .trackbar { width: min(280px, 70vw); height: 10px; background: var(--container); border-radius: 999px; overflow: hidden; }
    .trackbar span { display: block; height: 100%; background: var(--primary-c); border-radius: inherit; }
    .pct { font-size: 13px; font-weight: 700; }
    .context-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .zoom, .seg { display: inline-flex; padding: 4px; background: var(--container); border-radius: 999px; }

    .station { display: flex; min-height: 560px; overflow: hidden; }
    .tree { width: var(--tree); flex: none; display: flex; flex-direction: column; background: var(--lowest); border-right: 1px solid #eef0fb; }
    .tree-head, .time-head { height: 56px; background: var(--low); }
    .tree-head {
      display: grid;
      grid-template-columns: 1fr 92px 72px;
      align-items: center;
      padding: 0 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .tree-body { overflow: auto; flex: 1; }
    .row {
      min-height: var(--row);
      display: grid;
      grid-template-columns: 1fr 92px 72px;
      align-items: center;
      gap: 6px;
      padding: 6px 12px 6px 10px;
      border-bottom: 1px solid #f4f5fb;
      cursor: pointer;
    }
    .row:hover, .row.on { background: var(--low); }
    .row-name { display: flex; flex-direction: column; min-width: 0; }
    .row-name strong {
      font-size: 13px; font-weight: 600; line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row-name em { font-style: normal; font-size: 11px; color: var(--muted); font-weight: 600; }
    .when { font-size: 11px; font-weight: 600; color: var(--muted); text-align: center; }
    .pill {
      justify-self: end;
      font-size: 10px; font-weight: 700;
      padding: 3px 7px; border-radius: 999px; white-space: nowrap;
    }
    .pill.running { background: var(--primary-fixed); color: var(--primary); }
    .pill.done { background: rgba(134, 242, 228, 0.55); color: #005049; }
    .pill.upcoming { background: var(--container); color: var(--muted); }
    .quick {
      padding: 10px;
      background: var(--low);
    }
    .quick input {
      width: 100%; height: 38px; border: 0; border-radius: 999px;
      padding: 0 14px; background: white; font-size: 13px;
    }

    .canvas { flex: 1; overflow: auto; min-width: 0; background: var(--surface); position: relative; }
    .sheet { position: relative; }
    .time-head { position: sticky; top: 0; z-index: 4; box-shadow: 0 1px 0 rgba(0,0,0,0.06); }
    .months, .weeks, .lane {
      display: grid;
      grid-template-columns: repeat(52, var(--col));
    }
    .months { height: 28px; }
    .weeks { height: 28px; }
    .month {
      display: flex; align-items: center; padding-left: 8px;
      font-family: var(--display); font-size: 13px; font-weight: 600;
      color: var(--muted); border-left: 1px solid #e1e4f5;
    }
    .wk {
      display: grid; place-items: center;
      font-size: 10px; font-weight: 600; color: var(--muted);
      border-left: 1px solid #e7e9f6;
    }
    .wk.today { background: rgba(219, 225, 255, 0.85); color: var(--primary); font-weight: 800; }
    .lane { position: relative; height: var(--row); border-bottom: 1px solid rgba(226, 231, 255, 0.7); }
    .lane:hover, .lane.on { background: rgba(242, 243, 255, 0.8); }
    .bar {
      height: 28px; margin-top: 12px; border-radius: 999px;
      display: flex; align-items: center; padding: 0 10px;
      font-size: 11px; font-weight: 700; overflow: hidden; white-space: nowrap;
      z-index: 1; cursor: pointer; box-shadow: 0 1px 3px rgba(19, 27, 46, 0.08);
    }
    .bar.running { background: var(--primary-c); color: white; }
    .bar.done { background: var(--secondary); color: white; }
    .bar.upcoming { background: var(--high); color: var(--ink); box-shadow: none; }
    .needle {
      position: absolute; top: 56px; bottom: 0; width: 2px; margin-left: -1px;
      background: repeating-linear-gradient(to bottom, var(--error), var(--error) 4px, transparent 4px, transparent 8px);
      z-index: 2; pointer-events: none;
    }
    .needle b {
      position: sticky; top: 58px;
      display: inline-block; transform: translate(-50%, 0);
      background: var(--error); color: white; border-radius: 999px;
      font-size: 10px; letter-spacing: 0.04em; padding: 2px 6px;
    }
    .empty { padding: 28px 16px; color: var(--muted); font-size: 14px; }

    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th {
      text-align: left; font-size: 11px; letter-spacing: 0.06em;
      color: var(--muted); padding: 12px 14px; background: var(--low); font-weight: 700;
    }
    td { padding: 12px 14px; border-top: 1px solid #f0f2fb; font-size: 14px; vertical-align: middle; }
    tr.data { cursor: pointer; }
    tr.data:hover td { background: #fafbff; }
    .sub { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .tiny { border: 0; background: transparent; color: var(--muted); font-weight: 700; font-size: 12px; padding: 6px; border-radius: 999px; }
    .tiny:hover { background: var(--low); color: var(--primary); }
    .tiny.danger:hover { color: var(--error); }

    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 14px; }
    .col { background: var(--low); border-radius: 14px; padding: 10px; min-height: 240px; }
    .col h3 { margin: 4px 8px 10px; font-size: 12px; letter-spacing: 0.06em; color: var(--muted); }
    .ticket {
      background: white; border-radius: 14px; padding: 12px; margin-bottom: 8px;
      box-shadow: 0 1px 3px rgba(19, 27, 46, 0.05); cursor: pointer;
    }
    .ticket strong { display: block; font-size: 14px; line-height: 1.35; }
    .ticket span { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; font-weight: 600; }

    .drawer-back {
      position: fixed; inset: 0; background: rgba(19, 27, 46, 0.28);
      z-index: 40; display: none;
    }
    .drawer-back.open { display: block; }
    .drawer {
      position: fixed; top: 0; right: 0; height: 100%; width: min(440px, 100%);
      background: var(--lowest); z-index: 50;
      transform: translateX(100%);
      transition: transform 240ms ease;
      display: flex; flex-direction: column;
      box-shadow: -12px 0 40px rgba(19, 27, 46, 0.12);
    }
    .drawer.open { transform: none; }
    .drawer header, .modal header {
      padding: 18px 18px 14px; background: var(--low);
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .drawer h2, .modal h2 { margin: 0; font-family: var(--display); font-size: 20px; font-weight: 600; }
    .drawer header p, .modal header p { margin: 2px 0 0; color: var(--muted); font-size: 12px; font-weight: 600; }
    .x {
      width: 36px; height: 36px; border: 0; border-radius: 999px; background: transparent; color: var(--muted);
      display: grid; place-items: center;
    }
    .x:hover { background: var(--container); color: var(--ink); }
    .drawer form, .modal form { padding: 18px; display: flex; flex-direction: column; gap: 14px; overflow: auto; }
    .field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
    .field input, .field select {
      height: 42px; border-radius: 12px; padding: 0 12px; font-size: 14px; font-weight: 500; color: var(--ink);
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .hint { margin: 0; font-size: 13px; color: var(--ink); font-weight: 500; }
    .err { margin: 0; min-height: 1.1em; color: var(--error); font-size: 13px; font-weight: 600; }
    .drawer footer, .modal .actions {
      margin-top: auto; padding: 14px 18px; background: var(--low);
      display: flex; justify-content: space-between; gap: 8px;
    }
    .modal {
      position: fixed; inset: 0; background: rgba(19, 27, 46, 0.4);
      display: none; align-items: center; justify-content: center; padding: 20px; z-index: 60;
    }
    .modal.open { display: flex; }
    .dialog { width: min(460px, 100%); background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 24px 60px rgba(19,27,46,.2); }

    .foot {
      max-width: 1680px; margin: 0 auto; padding: 0 22px 28px;
      display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      color: var(--muted); font-size: 12px; font-weight: 600;
    }
    .link { border: 0; background: none; color: var(--primary); font-weight: 700; font-size: 12px; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
    .toast {
      position: fixed; bottom: 16px; left: 50%; transform: translate(-50%, 8px);
      background: #131b2e; color: white; border-radius: 999px; padding: 10px 14px;
      font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; z-index: 70;
      transition: 160ms ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .view { display: none; }
    .view.on { display: block; }
    #view-gantt.on { display: block; }

    @media (max-width: 980px) {
      .station { flex-direction: column; max-height: none; }
      .tree { width: 100%; border-right: 0; border-bottom: 1px solid #eef0fb; }
      .tree-body { max-height: 320px; }
      .canvas { min-height: 420px; }
      .board { grid-template-columns: 1fr; }
      .tabs button { padding: 0 8px; font-size: 12px; }
    }
    @media (max-width: 640px) {
      .grid-2 { grid-template-columns: 1fr; }
      .lockup img { height: 22px; }
      h1 { font-size: 20px; }
      .wrap { padding-left: 12px; padding-right: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .drawer, .toast { transition: none; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand-row">
        <div class="lockup"><img src="logo.jpg" width="1500" height="125" alt="Martur Italy"></div>
        <span class="rule" aria-hidden="true"></span>
        <label class="sr" for="projectSelect" style="position:absolute;left:-999px">Proje</label>
        <select id="projectSelect" class="project-select"></select>
        <nav class="tabs" aria-label="Görünüm">
          <button type="button" class="on" data-view="gantt">Zaman çizelgesi</button>
          <button type="button" data-view="list">Görev listesi</button>
          <button type="button" data-view="board">Pano</button>
        </nav>
      </div>
      <div class="tools">
        <input id="search" class="search" type="search" placeholder="Faz veya kilometre taşı ara" aria-label="Ara">
        <div class="zoom" role="group" aria-label="Ölçek">
          <button type="button" data-zoom="month">Ay</button>
          <button type="button" class="on" data-zoom="week">Hafta</button>
          <button type="button" data-zoom="day">Gün</button>
        </div>
        <button type="button" class="btn" id="exportBtn">Dışa aktar</button>
        <label class="btn">İçe aktar<input id="importFile" type="file" accept="application/json,.json" hidden></label>
        <button type="button" class="btn btn-primary" id="addTaskBtn">+ Yeni faz</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="card context">
      <div>
        <div class="title-row">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 16l4-8 4 6 3-4 5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div>
            <h1 id="projectTitle">—</h1>
            <p class="meta" id="projectMeta"></p>
          </div>
          <span class="badge" id="health"><i></i><span>Yolunda</span></span>
        </div>
        <div class="progress-line">
          <div class="trackbar" aria-hidden="true"><span id="barFill" style="width:0%"></span></div>
          <span class="pct" id="pctLabel">%0 tamam</span>
          <span class="dot"></span>
          <span class="pct" id="liveLabel" style="font-weight:600;color:var(--muted)"></span>
        </div>
      </div>
      <div class="context-actions">
        <div class="seg">
          <button type="button" id="todayBtn">Bugün</button>
        </div>
        <button type="button" class="btn" id="editProjectBtn">Projeyi düzenle</button>
        <button type="button" class="btn" id="newProjectBtn">Yeni proje</button>
        <button type="button" class="btn btn-danger" id="deleteProjectBtn">Sil</button>
      </div>
    </section>

    <section class="card view on" id="view-gantt">
      <div class="station">
        <div class="tree">
          <div class="tree-head"><span>FAZ</span><span style="text-align:center">HAFTA</span><span style="text-align:right">DURUM</span></div>
          <div class="tree-body" id="treeBody"></div>
          <form class="quick" id="quickForm">
            <input id="quickName" placeholder="+ Hızlı faz ekle, Enter" maxlength="160" aria-label="Hızlı faz ekle">
          </form>
        </div>
        <div class="canvas" id="ganttScroll"></div>
      </div>
    </section>

    <section class="card view" id="view-list">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:52px">#</th>
              <th>Faz</th>
              <th>Pencere</th>
              <th>Hafta</th>
              <th>Durum</th>
              <th>Kilometre taşları</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="taskBody"></tbody>
        </table>
      </div>
    </section>

    <section class="card view" id="view-board">
      <div class="board" id="board"></div>
    </section>
  </main>

  <footer class="foot">
    <span>Martur Fompak International · Torino. Plan bu tarayıcıda durur; çıkmadan yedek alın.</span>
    <button type="button" class="link" id="resetBtn">Örnek planı geri yükle</button>
  </footer>

  <div class="drawer-back" id="drawerBack"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <header>
      <div>
        <h2 id="drawerTitle">Faz</h2>
        <p>Haftalar ISO. 49’dan 4’e geçen bir faz yılı keser.</p>
      </div>
      <button type="button" class="x" id="drawerClose" aria-label="Kapat">
        <svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </header>
    <form id="taskForm">
      <input type="hidden" id="taskId">
      <label class="field">Faz adı
        <input id="taskName" required maxlength="160" placeholder="Trim covers development">
      </label>
      <div class="grid-2">
        <label class="field">Başlangıç haftası
          <input id="taskStart" type="number" min="1" max="52" required>
        </label>
        <label class="field">Bitiş haftası
          <input id="taskEnd" type="number" min="1" max="52" required>
        </label>
      </div>
      <p class="hint" id="taskSpan"></p>
      <label class="field">Kilometre taşları
        <input id="taskNotes" maxlength="240" placeholder="Virgülle, örn. PO RM, X1">
      </label>
      <p class="err" id="taskError"></p>
    </form>
    <footer>
      <button type="button" class="btn btn-danger" id="drawerDelete">Fazı sil</button>
      <div style="display:flex;gap:8px">
        <button type="button" class="btn" id="drawerCancel">Vazgeç</button>
        <button type="submit" form="taskForm" class="btn btn-primary">Kaydet</button>
      </div>
    </footer>
  </aside>

  <div class="modal" id="projectModal" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle">
    <div class="dialog">
      <header>
        <div>
          <h2 id="projectModalTitle">Yeni proje</h2>
          <p>Araç, müşteri ve SOP notu.</p>
        </div>
        <button type="button" class="x" data-close="projectModal" aria-label="Kapat">
          <svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </header>
      <form id="projectForm">
        <input type="hidden" id="projectEditId">
        <label class="field">Proje adı
          <input id="projectName" required maxlength="120">
        </label>
        <label class="field">Araç / müşteri
          <input id="projectMetaInput" required maxlength="180">
        </label>
        <div class="actions">
          <button type="button" class="btn" data-close="projectModal">Vazgeç</button>
          <button type="submit" class="btn btn-primary">Kaydet</button>
        </div>
      </form>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const STORAGE_KEY = "martur_projects";
    const ACTIVE_KEY = "martur_active_project";
    const MONTHS = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
    const STATUS = { running: "Devam", done: "Tamam", upcoming: "Plan" };

    function sampleProjects() {
      return [
        {
          id: "p1",
          name: "332 Emporio Armani Macro Dev",
          meta: "Pre-DV testleri (OT koltuk) · SOP Eyl 2027",
          tasks: [
            { id: "t1", name: "1. Trim covers r.m. orders, procurements, delivery", startWeek: 36, endWeek: 42, milestones: "PO RM, feettek NON" },
            { id: "t2", name: "2. Trim covers development (cut&sew)", startWeek: 38, endWeek: 44, milestones: "evo del" },
            { id: "t3", name: "3. Trim covers patterns and drw's to tier2", startWeek: 40, endWeek: 46, milestones: "" },
            { id: "t4", name: "4. Offers, odm, commercial discussion and agreement", startWeek: 36, endWeek: 41, milestones: "odm activation" },
            { id: "t5", name: "5. OT trim covers build (low volume tool)", startWeek: 42, endWeek: 48, milestones: "X1, X2" },
            { id: "t6", name: "6. OT seats availability", startWeek: 47, endWeek: 50, milestones: "X3" },
            { id: "t7", name: "7. OTOP trim covers build", startWeek: 49, endWeek: 52, milestones: "electrowelding" },
            { id: "t8", name: "8. PV tests & PPAP components", startWeek: 2, endWeek: 12, milestones: "PV tests, PPAP" },
            { id: "t9", name: "9. Ramp-up & SOP", startWeek: 14, endWeek: 20, milestones: "SOP" }
          ]
        },
        {
          id: "p2",
          name: "Stellantis MY'27 Front Seats",
          meta: "Easy Entry programı · SOP Oca 2028",
          tasks: [
            { id: "t201", name: "1. Concept design & feasibility", startWeek: 1, endWeek: 10, milestones: "Kickoff, DFMEA" },
            { id: "t202", name: "2. Prototype tooling & sampling", startWeek: 11, endWeek: 25, milestones: "T1 samples" },
            { id: "t203", name: "3. Validation testing & compliance", startWeek: 26, endWeek: 35, milestones: "R17 / R21 tests" }
          ]
        }
      ];
    }

    function mondayUTC(year, week) {
      const jan4 = new Date(Date.UTC(year, 0, 4));
      const dow = jan4.getUTCDay() || 7;
      return new Date(Date.UTC(year, 0, 4 - dow + 1 + (week - 1) * 7));
    }
    function isoOf(date) {
      const utc = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dow = utc.getUTCDay() || 7;
      utc.setUTCDate(utc.getUTCDate() + 4 - dow);
      const isoYear = utc.getUTCFullYear();
      const yearStart = new Date(Date.UTC(isoYear, 0, 1));
      const week = Math.ceil((((utc - yearStart) / 86400000) + 1) / 7);
      return { year: isoYear, week };
    }
    function buildHorizon() {
      const out = [];
      const push = (year, week) => {
        const monday = mondayUTC(year, week);
        const thursday = new Date(monday);
        thursday.setUTCDate(monday.getUTCDate() + 3);
        out.push({
          year, week, monday,
          monthLabel: MONTHS[thursday.getUTCMonth()] + " " + String(thursday.getUTCFullYear()).slice(2)
        });
      };
      for (let w = 36; w <= 52; w++) push(2026, w);
      for (let w = 1; w <= 35; w++) push(2027, w);
      return out;
    }
    const HORIZON = buildHorizon();
    const fmt = new Intl.DateTimeFormat("tr-TR", { day: "numeric", month: "short", timeZone: "UTC" });
    const fmtLong = new Intl.DateTimeFormat("tr-TR", { day: "numeric", month: "short", year: "numeric" });

    function clampWeek(n) {
      const x = Math.round(Number(n));
      if (!Number.isFinite(x)) return 1;
      return Math.min(52, Math.max(1, x));
    }
    function normalize(list) {
      if (!Array.isArray(list) || !list.length) return sampleProjects();
      const projects = list.map((p, i) => ({
        id: String(p && p.id || "p_" + i),
        name: String(p && p.name || "Adsız proje").slice(0, 120),
        meta: String(p && p.meta || "").slice(0, 180),
        tasks: Array.isArray(p && p.tasks) ? p.tasks.map((t, j) => ({
          id: String(t && t.id || "t_" + i + "_" + j),
          name: String(t && t.name || "Adsız faz").slice(0, 160),
          startWeek: clampWeek(t && t.startWeek),
          endWeek: clampWeek(t && t.endWeek),
          milestones: String(t && t.milestones || "").slice(0, 240)
        })) : []
      }));
      return projects.length ? projects : sampleProjects();
    }
    function coverage(task) {
      const a = HORIZON.findIndex(w => w.week === clampWeek(task.startWeek));
      const b = HORIZON.findIndex(w => w.week === clampWeek(task.endWeek));
      if (a < 0 || b < 0) return null;
      const idx = [];
      if (a <= b) for (let i = a; i <= b; i++) idx.push(i);
      else for (let i = a; i < HORIZON.length; i++) idx.push(i);
      const segs = [];
      let s = idx[0], p = idx[0];
      for (let i = 1; i < idx.length; i++) {
        if (idx[i] === p + 1) p = idx[i];
        else { segs.push([s, p]); s = p = idx[i]; }
      }
      if (idx.length) segs.push([s, p]);
      return { idx, segs, inverted: a > b };
    }
    function segmentEnd(index) {
      const end = new Date(HORIZON[index].monday);
      end.setUTCDate(end.getUTCDate() + 6);
      return end;
    }
    function dateRangeText(task) {
      const cov = coverage(task);
      if (!cov) return "";
      return cov.segs.map(([a, b]) => fmt.format(HORIZON[a].monday) + " – " + fmt.format(segmentEnd(b))).join(" + ");
    }
    function todayIndex() {
      const iso = isoOf(new Date());
      return HORIZON.findIndex(w => w.year === iso.year && w.week === iso.week);
    }
    function statusOf(task, todayIdx) {
      const cov = coverage(task);
      if (!cov || todayIdx < 0) return "upcoming";
      if (cov.idx.includes(todayIdx)) return "running";
      const last = Math.max(...cov.idx);
      return todayIdx > last ? "done" : "upcoming";
    }
    function monthGroups() {
      const groups = [];
      HORIZON.forEach((w, i) => {
        const last = groups[groups.length - 1];
        if (!last || last.label !== w.monthLabel) groups.push({ label: w.monthLabel, count: 1, start: i });
        else last.count += 1;
      });
      return groups;
    }

    let projects = [];
    let activeId = "";
    let view = "gantt";
    let zoom = "week";
    let query = "";
    let toastTimer = 0;
    let syncing = false;

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        projects = raw ? normalize(JSON.parse(raw)) : sampleProjects();
      } catch { projects = sampleProjects(); }
      const saved = localStorage.getItem(ACTIVE_KEY);
      activeId = projects.some(p => p.id === saved) ? saved : projects[0].id;
    }
    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
      localStorage.setItem(ACTIVE_KEY, activeId);
    }
    function current() { return projects.find(p => p.id === activeId) || projects[0]; }
    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
    }
    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text != null) node.textContent = text;
      return node;
    }
    function visibleTasks(project) {
      const q = query.trim().toLocaleLowerCase("tr");
      if (!q) return project.tasks.map((task, index) => ({ task, index }));
      return project.tasks.map((task, index) => ({ task, index })).filter(({ task }) =>
        (task.name + " " + task.milestones).toLocaleLowerCase("tr").includes(q)
      );
    }
    function colWidth() { return zoom === "month" ? 20 : zoom === "day" ? 58 : 36; }

    function renderSelect() {
      const select = document.getElementById("projectSelect");
      select.replaceChildren();
      projects.forEach(p => {
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = p.name;
        select.appendChild(opt);
      });
      select.value = current().id;
    }

    function renderSummary(project, rows) {
      const todayIdx = todayIndex();
      let done = 0, running = 0;
      project.tasks.forEach(task => {
        const s = statusOf(task, todayIdx);
        if (s === "done") done += 1;
        if (s === "running") running += 1;
      });
      const pct = project.tasks.length ? Math.round((done / project.tasks.length) * 100) : 0;
      document.getElementById("projectTitle").textContent = project.name;
      const iso = isoOf(new Date());
      const meta = document.getElementById("projectMeta");
      meta.replaceChildren();
      meta.append(document.createTextNode(project.meta || "Araç notu yok"));
      meta.append(el("span", "dot"));
      meta.append(document.createTextNode("Bugün H" + iso.week + " · " + fmtLong.format(new Date())));
      const health = document.getElementById("health");
      const label = health.querySelector("span");
      health.className = "badge" + (running ? "" : done && done === project.tasks.length ? " done" : " idle");
      label.textContent = running ? "Yolunda" : done && done === project.tasks.length ? "Tamamlandı" : "Planlandı";
      document.getElementById("barFill").style.width = pct + "%";
      document.getElementById("pctLabel").textContent = "%" + pct + " tamam";
      document.getElementById("liveLabel").textContent = running + " devam · " + rows.length + " faz görünür";
      document.getElementById("deleteProjectBtn").disabled = projects.length <= 1;
    }

    function renderGantt(project, rows) {
      const host = document.getElementById("ganttScroll");
      const tree = document.getElementById("treeBody");
      host.replaceChildren();
      tree.replaceChildren();
      document.documentElement.style.setProperty("--col", colWidth() + "px");
      const todayIdx = todayIndex();
      if (!rows.length) {
        tree.appendChild(el("div", "empty", query ? "Aramayla eşleşen faz yok." : "Henüz faz yok. Alttan veya Yeni faz ile ekleyin."));
        host.appendChild(el("div", "empty", "Çizelge boş."));
        return;
      }
      rows.forEach(({ task, index }) => {
        const status = statusOf(task, todayIdx);
        const row = el("div", "row");
        row.dataset.id = task.id;
        const name = el("div", "row-name");
        name.appendChild(el("strong", null, task.name));
        name.appendChild(el("em", null, task.milestones || "Kilometre taşı yok"));
        row.append(name, el("div", "when", "H" + task.startWeek + "–" + task.endWeek), el("span", "pill " + status, STATUS[status]));
        row.addEventListener("click", () => openTask(task));
        tree.appendChild(row);
      });

      const sheet = el("div", "sheet");
      const head = el("div", "time-head");
      const months = el("div", "months");
      let cursor = 1;
      monthGroups().forEach(group => {
        const cell = el("div", "month", group.label);
        cell.style.gridColumn = cursor + " / span " + group.count;
        months.appendChild(cell);
        cursor += group.count;
      });
      const weeks = el("div", "weeks");
      HORIZON.forEach((w, i) => {
        const cell = el("div", "wk" + (i === todayIdx ? " today" : ""), zoom === "day" ? String(w.week) : String(w.week));
        cell.title = "Hafta " + w.week + " · " + fmtLong.format(w.monday);
        if (zoom === "day") cell.textContent = w.week + " · " + fmt.format(w.monday);
        weeks.appendChild(cell);
      });
      head.append(months, weeks);
      sheet.appendChild(head);

      rows.forEach(({ task }) => {
        const status = statusOf(task, todayIdx);
        const cov = coverage(task);
        const lane = el("div", "lane");
        lane.dataset.id = task.id;
        if (cov) {
          cov.segs.forEach(seg => {
            const span = seg[1] - seg[0] + 1;
            const bar = el("div", "bar " + status);
            bar.style.gridColumn = (seg[0] + 1) + " / span " + span;
            const note = (task.milestones || "").split(",")[0].trim();
            if (span >= (zoom === "month" ? 6 : 3) && note) bar.textContent = note;
            else if (zoom !== "month" && span >= 2) bar.textContent = "H" + task.startWeek;
            bar.title = task.name + " · H" + task.startWeek + "–H" + task.endWeek + (task.milestones ? " · " + task.milestones : "");
            bar.addEventListener("click", () => openTask(task));
            lane.appendChild(bar);
          });
        }
        lane.addEventListener("click", (e) => { if (e.target === lane) openTask(task); });
        sheet.appendChild(lane);
      });

      if (todayIdx >= 0) {
        const needle = el("div", "needle");
        needle.style.left = ((todayIdx + 0.5) / HORIZON.length * 100) + "%";
        needle.appendChild(el("b", null, "BUGÜN"));
        sheet.appendChild(needle);
      }
      host.appendChild(sheet);
      bindHover();
    }

    function bindHover() {
      const map = new Map();
      document.querySelectorAll(".row, .lane").forEach(node => {
        const id = node.dataset.id;
        if (!map.has(id)) map.set(id, []);
        map.get(id).push(node);
        node.addEventListener("mouseenter", () => map.get(id).forEach(n => n.classList.add("on")));
        node.addEventListener("mouseleave", () => map.get(id).forEach(n => n.classList.remove("on")));
      });
    }

    function renderList(project, rows) {
      const body = document.getElementById("taskBody");
      body.replaceChildren();
      const todayIdx = todayIndex();
      if (!rows.length) {
        const tr = document.createElement("tr");
        const td = el("td", "empty", query ? "Eşleşme yok." : "Liste boş.");
        td.colSpan = 7;
        tr.appendChild(td);
        body.appendChild(tr);
        return;
      }
      rows.forEach(({ task, index }) => {
        const status = statusOf(task, todayIdx);
        const cov = coverage(task);
        const tr = el("tr", "data");
        tr.append(
          el("td", null, String(index + 1).padStart(2, "0")),
          el("td", null, task.name),
          (() => { const td = el("td"); td.append(document.createTextNode("H" + task.startWeek + " – H" + task.endWeek), el("span", "sub", dateRangeText(task))); return td; })(),
          el("td", null, cov ? String(cov.idx.length) : "—"),
          (() => { const td = el("td"); td.appendChild(el("span", "pill " + status, STATUS[status])); return td; })(),
          el("td", null, task.milestones || "—"),
          (() => {
            const td = el("td");
            const up = el("button", "tiny", "Yukarı");
            const down = el("button", "tiny", "Aşağı");
            up.type = down.type = "button";
            up.disabled = index === 0;
            down.disabled = index === project.tasks.length - 1;
            up.addEventListener("click", (e) => { e.stopPropagation(); moveTask(task.id, -1); });
            down.addEventListener("click", (e) => { e.stopPropagation(); moveTask(task.id, 1); });
            td.append(up, down);
            return td;
          })()
        );
        tr.addEventListener("click", () => openTask(task));
        body.appendChild(tr);
      });
    }

    function renderBoard(rows) {
      const host = document.getElementById("board");
      host.replaceChildren();
      const todayIdx = todayIndex();
      const groups = [
        ["done", "Tamamlanan"],
        ["running", "Devam eden"],
        ["upcoming", "Planlanan"]
      ];
      groups.forEach(([key, title]) => {
        const col = el("div", "col");
        const items = rows.filter(({ task }) => statusOf(task, todayIdx) === key);
        col.appendChild(el("h3", null, title + " · " + items.length));
        if (!items.length) col.appendChild(el("div", "empty", "Boş"));
        items.forEach(({ task }) => {
          const card = el("div", "ticket");
          card.append(el("strong", null, task.name), el("span", null, "H" + task.startWeek + "–H" + task.endWeek + (task.milestones ? " · " + task.milestones : "")));
          card.addEventListener("click", () => openTask(task));
          col.appendChild(card);
        });
        host.appendChild(col);
      });
    }

    function render() {
      const project = current();
      activeId = project.id;
      const rows = visibleTasks(project);
      renderSelect();
      renderSummary(project, rows);
      renderGantt(project, rows);
      renderList(project, rows);
      renderBoard(rows);
      document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "view-" + view));
    }

    function scrollToToday() {
      const host = document.getElementById("ganttScroll");
      const idx = todayIndex();
      if (!host || idx < 0) return;
      const x = idx * colWidth() - host.clientWidth * 0.35;
      host.scrollTo({ left: Math.max(0, x), behavior: "smooth" });
    }

    function openTask(task) {
      document.getElementById("taskError").textContent = "";
      document.getElementById("drawerTitle").textContent = task ? "Fazı düzenle" : "Yeni faz";
      document.getElementById("taskId").value = task ? task.id : "";
      document.getElementById("taskName").value = task ? task.name : "";
      document.getElementById("taskStart").value = task ? task.startWeek : (todayIndex() >= 0 ? HORIZON[todayIndex()].week : 36);
      document.getElementById("taskEnd").value = task ? task.endWeek : clampWeek((todayIndex() >= 0 ? HORIZON[todayIndex()].week : 36) + 4);
      document.getElementById("taskNotes").value = task ? task.milestones : "";
      document.getElementById("drawerDelete").hidden = !task;
      updateSpan();
      document.getElementById("drawer").classList.add("open");
      document.getElementById("drawerBack").classList.add("open");
      document.getElementById("taskName").focus();
    }
    function closeTask() {
      document.getElementById("drawer").classList.remove("open");
      document.getElementById("drawerBack").classList.remove("open");
    }
    function updateSpan() {
      const hint = document.getElementById("taskSpan");
      const start = document.getElementById("taskStart").value;
      const end = document.getElementById("taskEnd").value;
      if (start === "" || end === "") { hint.textContent = ""; return; }
      const task = { startWeek: clampWeek(start), endWeek: clampWeek(end) };
      const cov = coverage(task);
      hint.textContent = (cov ? cov.idx.length : 0) + " hafta · " + dateRangeText(task) + (cov && cov.inverted ? " · bitiş bu pencerede başlangıçtan önce, bar plan sonuna kadar gider" : "");
    }
    function saveTask(event) {
      event.preventDefault();
      const project = current();
      const id = document.getElementById("taskId").value;
      const name = document.getElementById("taskName").value.trim();
      if (!name) { document.getElementById("taskError").textContent = "Faza bir ad verin."; return; }
      const task = {
        id: id || "t_" + Date.now(),
        name,
        startWeek: clampWeek(document.getElementById("taskStart").value),
        endWeek: clampWeek(document.getElementById("taskEnd").value),
        milestones: document.getElementById("taskNotes").value.trim()
      };
      if (id) {
        const i = project.tasks.findIndex(t => t.id === id);
        if (i >= 0) project.tasks[i] = task;
      } else project.tasks.push(task);
      save();
      closeTask();
      render();
      toast(id ? "Faz güncellendi" : "Faz eklendi");
    }
    function deleteTask(id) {
      const project = current();
      const task = project.tasks.find(t => t.id === id);
      if (!task) return;
      if (!confirm('"' + task.name + '" silinsin mi?')) return;
      project.tasks = project.tasks.filter(t => t.id !== id);
      save();
      closeTask();
      render();
    }
    function moveTask(id, dir) {
      const project = current();
      const i = project.tasks.findIndex(t => t.id === id);
      const j = i + dir;
      if (i < 0 || j < 0 || j >= project.tasks.length) return;
      const [task] = project.tasks.splice(i, 1);
      project.tasks.splice(j, 0, task);
      save();
      render();
    }
    function openProject(existing) {
      document.getElementById("projectModalTitle").textContent = existing ? "Projeyi düzenle" : "Yeni proje";
      document.getElementById("projectEditId").value = existing ? existing.id : "";
      document.getElementById("projectName").value = existing ? existing.name : "";
      document.getElementById("projectMetaInput").value = existing ? existing.meta : "";
      document.getElementById("projectModal").classList.add("open");
      document.getElementById("projectName").focus();
    }
    function closeProject() { document.getElementById("projectModal").classList.remove("open"); }
    function saveProject(event) {
      event.preventDefault();
      const id = document.getElementById("projectEditId").value;
      const name = document.getElementById("projectName").value.trim();
      const meta = document.getElementById("projectMetaInput").value.trim();
      if (id) {
        const project = projects.find(p => p.id === id);
        if (project) { project.name = name; project.meta = meta; }
      } else {
        const project = { id: "p_" + Date.now(), name, meta, tasks: [] };
        projects.push(project);
        activeId = project.id;
      }
      save();
      closeProject();
      render();
      toast(id ? "Proje güncellendi" : "Proje açıldı");
    }
    function deleteProject() {
      if (projects.length <= 1) return;
      const project = current();
      if (!confirm('"' + project.name + '" ve tüm plan silinsin mi?')) return;
      projects = projects.filter(p => p.id !== project.id);
      activeId = projects[0].id;
      save();
      render();
    }
    function exportData() {
      const blob = new Blob([JSON.stringify(projects, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "martur-italy-timeline-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast("Yedek indirildi");
    }
    function importData(event) {
      const file = event.target.files && event.target.files[0];
      event.target.value = "";
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result));
          if (!Array.isArray(parsed) || !parsed.length) throw new Error("empty");
          if (!confirm("Bu tarayıcıdaki tüm projeler yedekle değiştirilsin mi?")) return;
          projects = normalize(parsed);
          activeId = projects[0].id;
          save();
          render();
          toast("Yedek alındı");
        } catch { toast("Dosya okunamadı"); }
      };
      reader.readAsText(file);
    }

    function init() {
      load();
      document.getElementById("projectSelect").addEventListener("change", (e) => { activeId = e.target.value; save(); render(); });
      document.querySelectorAll("[data-view]").forEach(btn => btn.addEventListener("click", () => {
        view = btn.dataset.view;
        document.querySelectorAll("[data-view]").forEach(b => b.classList.toggle("on", b === btn));
        render();
      }));
      document.querySelectorAll("[data-zoom]").forEach(btn => btn.addEventListener("click", () => {
        zoom = btn.dataset.zoom;
        document.querySelectorAll("[data-zoom]").forEach(b => b.classList.toggle("on", b === btn));
        render();
        scrollToToday();
      }));
      document.getElementById("search").addEventListener("input", (e) => { query = e.target.value; render(); });
      document.getElementById("addTaskBtn").addEventListener("click", () => openTask(null));
      document.getElementById("newProjectBtn").addEventListener("click", () => openProject(null));
      document.getElementById("editProjectBtn").addEventListener("click", () => openProject(current()));
      document.getElementById("deleteProjectBtn").addEventListener("click", deleteProject);
      document.getElementById("exportBtn").addEventListener("click", exportData);
      document.getElementById("importFile").addEventListener("change", importData);
      document.getElementById("todayBtn").addEventListener("click", () => { view = "gantt"; document.querySelectorAll("[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === "gantt")); render(); scrollToToday(); });
      document.getElementById("taskForm").addEventListener("submit", saveTask);
      document.getElementById("taskStart").addEventListener("input", updateSpan);
      document.getElementById("taskEnd").addEventListener("input", updateSpan);
      document.getElementById("drawerClose").addEventListener("click", closeTask);
      document.getElementById("drawerCancel").addEventListener("click", closeTask);
      document.getElementById("drawerBack").addEventListener("click", closeTask);
      document.getElementById("drawerDelete").addEventListener("click", () => deleteTask(document.getElementById("taskId").value));
      document.getElementById("projectForm").addEventListener("submit", saveProject);
      document.querySelectorAll("[data-close]").forEach(btn => btn.addEventListener("click", closeProject));
      document.getElementById("projectModal").addEventListener("click", (e) => { if (e.target.id === "projectModal") closeProject(); });
      document.getElementById("quickForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const name = document.getElementById("quickName").value.trim();
        if (!name) return;
        const start = todayIndex() >= 0 ? HORIZON[todayIndex()].week : 36;
        current().tasks.push({ id: "t_" + Date.now(), name, startWeek: start, endWeek: clampWeek(start + 3), milestones: "" });
        document.getElementById("quickName").value = "";
        save();
        render();
        toast("Faz eklendi");
      });
      document.getElementById("resetBtn").addEventListener("click", () => {
        if (!confirm("Tarayıcıdaki plan örnek Martur planıyla değiştirilsin mi?")) return;
        projects = sampleProjects();
        activeId = projects[0].id;
        save();
        render();
        toast("Örnek plan yüklendi");
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") { closeTask(); closeProject(); }
        if ((e.key === "t" || e.key === "T") && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) scrollToToday();
      });
      const tree = document.getElementById("treeBody");
      const canvas = document.getElementById("ganttScroll");
      tree.addEventListener("scroll", () => { if (syncing) return; syncing = true; canvas.scrollTop = tree.scrollTop; syncing = false; });
      canvas.addEventListener("scroll", () => { if (syncing) return; syncing = true; tree.scrollTop = canvas.scrollTop; syncing = false; });
      render();
      requestAnimationFrame(scrollToToday);
    }
    init();
  </script>
</body>
</html>
